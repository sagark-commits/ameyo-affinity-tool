# Example custom profile for affinity_tool.sh
# Usage:
#   sudo ./affinity_tool.sh --role custom --profile profiles/custom.example.conf --apply
#
# CPU numbers are logical CPU ids (same as in top / taskset).
# Leave irq_* blank to auto-assign.

# Always keep system / tools / dagent on 0
tools=0
dagent=0

# Services (comma-separated CPUs allowed)
database=1,2
server=3,4
acp=3,4
asterisk=5,6
ameyoreports=3
ameyoarchiver=3
ameyo_voicelogs_conversion=3

# Optional IRQ pins (logical CPU id)
irq_disk=1
irq_ethernet=0
irq_telephony=5
